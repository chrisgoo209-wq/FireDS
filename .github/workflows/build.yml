name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch
        run: |
          unzip -oq FireDS.zip
          f=$(find FireDS -name Home.kt | head -1)
          grep -q 'saveable.rememberSaveable' "$f" || sed -i 's/^import androidx.compose.runtime.\*$/&\nimport androidx.compose.runtime.saveable.rememberSaveable/' "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p FireDS assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FireDS-apk
          path: FireDS/app/build/outputs/apk/debug/app-debug.apk
